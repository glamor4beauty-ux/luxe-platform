<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Accounts</title>
<style>
  :root{--ink:#0E1116;--surface:#171C26;--surface-2:#1E2530;--line:#283040;--text:#E8ECF3;
    --muted:#8B95A7;--faint:#5C6679;--action:#4C8DFF;--onair:#FF3340;--ok:#36C28B;
    --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  *{box-sizing:border-box}body{margin:0;font-family:var(--ui);background:var(--ink);color:var(--text);min-height:100vh}
  .wrap{max-width:720px;margin:0 auto;padding:28px 20px}
  a.back{color:var(--faint);text-decoration:none;font-size:13px}a.back:hover{color:var(--text)}
  h1{font-size:20px;letter-spacing:.04em;margin:14px 0 22px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}
  .card h2{margin:0 0 16px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  .fld{display:flex;flex-direction:column;gap:6px;flex:1;min-width:140px}
  .fld label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  input,select{background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:11px;color:var(--text);font:inherit;font-size:14px}
  input:focus,select:focus{outline:none;border-color:var(--action)}
  button{font:inherit;cursor:pointer;border:none;border-radius:9px;padding:11px 18px;font-weight:650}
  .add{background:var(--text);color:#0c0f14}
  .msg{margin-top:12px;font-size:13px;min-height:18px}
  .msg.ok{color:var(--ok)}.msg.err{color:var(--onair)}
  table{width:100%;border-collapse:collapse}
  td,th{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);font-size:14px}
  th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .tag{font-size:11px;padding:3px 9px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
  .tag.admin{background:var(--onair);color:#fff}
  .del{background:transparent;border:1px solid var(--line);color:var(--faint);padding:7px 12px;font-size:12px}
  .del:hover{border-color:var(--onair);color:var(--onair)}
  #gate{display:grid;place-items:center;height:100vh;color:var(--muted);text-align:center;padding:20px}
</style>

<div id="gate">Checking access…</div>

<div class="wrap" id="main" style="display:none">
  <a class="back" href="/studio/">← Back to console</a>
  <h1>Manage Accounts</h1>

  <div class="card">
    <h2>Add or update a model</h2>
    <div class="row">
      <div class="fld"><label>Username</label><input id="u" autocomplete="off"></div>
      <div class="fld"><label>Password</label><input id="p" type="text" autocomplete="off" placeholder="min 6 chars"></div>
      <div class="fld" style="flex:0 0 130px"><label>Role</label>
        <select id="r"><option value="performer">Performer</option><option value="admin">Admin</option></select></div>
      <button class="add" id="addBtn">Add</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <h2>Accounts</h2>
    <table><thead><tr><th>Username</th><th>Role</th><th></th></tr></thead><tbody id="list"></tbody></table>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
async function api(opts){ return fetch("api/users.php",Object.assign({headers:{'Content-Type':'application/json'}},opts)); }

async function gate(){
  try{ const d=await (await fetch("api/me.php")).json();
    if(d.ok && d.role==="admin"){ $("#gate").style.display="none"; $("#main").style.display=""; load(); return; }
    if(d.ok){ $("#gate").innerHTML="Admins only.<br><a class='back' href='/studio/'>← Back</a>"; return; }
  }catch(e){}
  location.href="/studio/";
}
async function load(){
  const d=await (await api({})).json(); const tb=$("#list"); tb.innerHTML="";
  (d.users||[]).forEach(u=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td></td><td><span class="tag ${u.role}">${u.role}</span></td>
      <td style="text-align:right"><button class="del">Remove</button></td>`;
    tr.querySelector("td").textContent=u.username;
    tr.querySelector(".del").addEventListener("click",()=>del(u.username));
    tb.appendChild(tr);
  });
}
$("#addBtn").addEventListener("click", async()=>{
  const m=$("#msg"); m.className="msg"; m.textContent="";
  const body=JSON.stringify({username:$("#u").value,password:$("#p").value,role:$("#r").value});
  const d=await (await api({method:"POST",body})).json();
  if(d.ok){ m.className="msg ok"; m.textContent="Saved."; $("#u").value="";$("#p").value=""; load(); }
  else { m.className="msg err"; m.textContent=d.error||"Failed."; }
});
async function del(u){
  if(!confirm("Remove "+u+"?")) return;
  const d=await (await api({method:"DELETE",body:JSON.stringify({username:u})})).json();
  if(d.ok) load(); else alert(d.error||"Failed.");
}
gate();
</script>
