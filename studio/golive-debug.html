<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Go Live (debug)</title>
<style>
  body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif;height:100vh}
  #prev{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #log{position:fixed;left:0;right:0;bottom:0;z-index:9;background:rgba(10,12,18,.95);border-top:2px solid #FF3340;
    padding:14px;font-size:13px;line-height:1.5;max-height:55%;overflow:auto;white-space:pre-wrap;word-break:break-word}
  #log b{color:#36C28B}
  .row{margin-bottom:10px}
  button{background:#36C28B;color:#062018;border:none;border-radius:10px;padding:14px 20px;font-size:16px;font-weight:700;width:100%;margin-top:8px}
  select{width:100%;padding:12px;margin:6px 0;background:#1E2530;color:#fff;border:1px solid #2b3445;border-radius:8px;font-size:15px}
</style>

<video id="prev" autoplay muted playsinline webkit-playsinline></video>

<div id="log"><b>DEBUG — step by step</b>
<div class="row" id="steps">starting…</div>
<select id="cam"></select>
<select id="mic"></select>
<button id="go">Go Live</button>
</div>

<script>
const $=s=>document.querySelector(s);
function log(t){ const s=$("#steps"); s.textContent += "\n• "+t; }

// catch ANY error and print it on screen
window.onerror=function(msg,src,line,col,err){ log("JS ERROR: "+msg+" @line "+line); return false; };
window.addEventListener("unhandledrejection",e=>{ log("PROMISE REJECT: "+(e.reason&&e.reason.message?e.reason.message:e.reason)); });

let stream=null, pc=null, live=false;

(async function(){
  log("script started");
  log("secure context: "+window.isSecureContext);
  log("has mediaDevices: "+!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia));

  try{
    log("requesting camera…");
    stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
    $("#prev").srcObject=stream;
    try{ await $("#prev").play(); log("camera playing"); }catch(e){ log("play() blocked: "+e.message); }
    log("CAMERA OK");
  }catch(e){ log("CAMERA FAILED: "+e.name+" — "+e.message); }

  try{
    const devs=await navigator.mediaDevices.enumerateDevices();
    log("devices found: "+devs.length);
    const cam=$("#cam"),mic=$("#mic");
    devs.filter(d=>d.kind==="videoinput").forEach((d,i)=>cam.add(new Option(d.label||("Camera "+(i+1)),d.deviceId)));
    devs.filter(d=>d.kind==="audioinput").forEach((d,i)=>mic.add(new Option(d.label||("Mic "+(i+1)),d.deviceId)));
  }catch(e){ log("enumerate failed: "+e.message); }

  try{
    log("checking login…");
    const r=await fetch("/studio/api/me.php",{credentials:"same-origin"});
    const d=await r.json();
    log("login status "+r.status+" — ok="+d.ok+(d.name?(" user="+d.name):""));
  }catch(e){ log("login check failed: "+e.message); }

  log("--- ready ---");
})();

$("#go").addEventListener("click",async()=>{
  log("Go Live tapped");
  if(!stream){ log("no stream — cannot publish"); return; }
  try{
    pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
    stream.getTracks().forEach(t=>pc.addTrack(t,stream));
    const o=await pc.createOffer(); await pc.setLocalDescription(o);
    await new Promise(r=>{ if(pc.iceGatheringState==="complete")return r(); const t=setTimeout(r,2000);
      pc.addEventListener("icegatheringstatechange",()=>{ if(pc.iceGatheringState==="complete"){clearTimeout(t);r();} }); });
    log("posting to WHIP…");
    const res=await fetch("/live/whip",{method:"POST",headers:{"Content-Type":"application/sdp"},body:pc.localDescription.sdp,credentials:"same-origin"});
    log("WHIP status: "+res.status);
    if(res.status===200||res.status===201){ await pc.setRemoteDescription({type:"answer",sdp:await res.text()}); log("LIVE!"); }
    else { log("WHIP rejected: "+res.status+(res.status===401?" (not logged in)":"")); }
  }catch(e){ log("publish error: "+e.message); }
});
</script>
