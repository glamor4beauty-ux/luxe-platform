<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#000}
  .stage{position:relative;width:100%;height:100%;min-height:220px;background:#000}
  video{width:100%;height:100%;object-fit:contain;background:#000}
  .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
       color:#8b93a3;font:15px system-ui,sans-serif;text-align:center;padding:20px}
</style>
</head>
<body>
<div class="stage">
  <video id="v" controls playsinline autoplay muted></video>
  <div class="msg" id="msg">Loading…</div>
</div>
<script>
(function(){
  // stream name from ?name=  (defaults to stream1). Change HLS_BASE if you serve HLS elsewhere.
  var HLS_BASE = 'https://dashboard.divafans.club/hls/';
  var name = (new URLSearchParams(location.search).get('name') || 'stream1').replace(/[^a-zA-Z0-9_-]/g,'') || 'stream1';
  var url = HLS_BASE + name + '.m3u8';
  var v = document.getElementById('v'), msg = document.getElementById('msg');
  function offline(){ msg.style.display='flex'; msg.textContent='Stream offline.'; }
  function online(){ msg.style.display='none'; }

  if (window.Hls && Hls.isSupported()) {
    var hls = new Hls({ liveSyncDurationCount: 3 });
    hls.loadSource(url);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, function(){ online(); v.play().catch(function(){}); });
    hls.on(Hls.Events.ERROR, function(e, d){
      if (d.fatal) {
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) { offline(); setTimeout(function(){ hls.loadSource(url); hls.startLoad(); }, 4000); }
        else { try { hls.recoverMediaError(); } catch(x){ offline(); } }
      }
    });
  } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
    // native HLS (Safari / iOS)
    v.src = url;
    v.addEventListener('loadedmetadata', function(){ online(); v.play().catch(function(){}); });
    v.addEventListener('error', offline);
  } else {
    msg.textContent = 'HLS not supported in this browser.';
  }
})();
</script>
</body>
</html>
